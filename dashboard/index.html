<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>{{ app_name }}</title>
		<meta
			name="description"
			content="Plan, manage, and track humanitarian assistance distributions. End-to-end workflows for voucher generation, hamper manufacturing, inventory management, and POS-based distributions."
		/>
		<link rel="apple-touch-icon" sizes="180x180" href="{{ apple_touch_icon }}" />
		<link rel="icon" type="image/png" href="{{ icon_96 }}" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="{{ favicon_svg }}" />
		<link rel="shortcut icon" href="{{ favicon_ico }}" />
		<meta name="msapplication-TileColor" content="#000000" />
		<meta name="theme-color" content="#191919" />
		<link rel="mask-icon" href="{{ mask_icon }}" color="#000000" />
		<meta name="apple-itunes-app" content="app-id=6741682327, app-argument={{sitename}}" />
		<link rel="manifest" href="/assets/nppos/nppos/manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="NPPOS" />
		<link rel="apple-touch-icon" href="/assets/nppos/nppos/icons/icon-192.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/assets/nppos/nppos/icons/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/assets/nppos/nppos/icons/icon-512.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="{{ app_name }}" />
		<meta name="apple-touch-fullscreen" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="screen-orientation" content="portrait" />
		<meta name="mobile-web-app-capable" content="yes" />
	</head>

	<body>
		<div id="root" vaul-drawer-wrapper="true"></div>

		<script>
			window.csrf_token = '{{ csrf_token }}';
			if (!window.frappe) window.frappe = {};
			window.app_name = "{{ app_name }}";

			frappe.boot = JSON.parse({{ boot }});
		</script>

		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
